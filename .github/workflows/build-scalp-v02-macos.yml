name: Build Scalp Signal v0.2 APK macOS

on:
  push:
    branches:
      - build-scalp-signal-apk
    paths:
      - .github/workflows/build-scalp-v02-macos.yml
      - .ci/scalp-v02.part*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore v0.2 source
        shell: bash
        run: |
          cat .ci/scalp-v02.part0 .ci/scalp-v02.part1 .ci/scalp-v02.part2 .ci/scalp-v02.part3 .ci/scalp-v02.part4 | base64 --decode > /tmp/scalp-v02.zip
          echo "3b654cc6918fe1ccff2dece2502db5d97bf9dc7583f38673cefab400efe0cc8c  /tmp/scalp-v02.zip" | shasum -a 256 -c -
          unzip -q /tmp/scalp-v02.zip
          test -f ScalpSignalAndroid/settings.gradle.kts
          grep -q 'symbol == "SKYAIUSDT"' ScalpSignalAndroid/app/src/main/java/com/scalpsignal/mobile/domain/SignalEngine.kt
          grep -q 'versionName = "0.2.0"' ScalpSignalAndroid/app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK 36
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ] && [ -n "$ANDROID_HOME" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        shell: bash
        run: gradle --no-daemon -p ScalpSignalAndroid :app:assembleDebug

      - name: Validate APK
        shell: bash
        run: |
          APK="ScalpSignalAndroid/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p dist
          cp "$APK" dist/ScalpSignal-v0.2.apk
          unzip -tq dist/ScalpSignal-v0.2.apk
          shasum -a 256 dist/ScalpSignal-v0.2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScalpSignal-v0.2-APK-macOS
          path: dist/ScalpSignal-v0.2.apk
          if-no-files-found: error
          retention-days: 7
