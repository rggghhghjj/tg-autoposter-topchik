name: Build Scalp Signal v0.2 APK Slim

on:
  push:
    branches:
      - build-scalp-signal-apk
    paths:
      - .github/workflows/build-scalp-v02-slim.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-slim
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore verified v0.2 source
        shell: bash
        run: |
          cat .ci/scalp-v02.part0 .ci/scalp-v02.part1 .ci/scalp-v02.part2 .ci/scalp-v02.part3 .ci/scalp-v02.part4 | base64 --decode > /tmp/scalp-v02.zip
          echo "3b654cc6918fe1ccff2dece2502db5d97bf9dc7583f38673cefab400efe0cc8c  /tmp/scalp-v02.zip" | sha256sum -c -
          unzip -q /tmp/scalp-v02.zip
          python3 - <<'PY'
          from pathlib import Path
          p=Path("ScalpSignalAndroid/app/src/main/java/com/scalpsignal/mobile/domain/SignalEngine.kt")
          s=p.read_text(encoding="utf-8")
          old="val confirmed = crossed && normalized >= 76"
          new="val confirmed = crossed && distanceAtr in 0.04..1.10 && normalized >= 76"
          if old not in s and new not in s:
              raise SystemExit("freshness patch target missing")
          p.write_text(s.replace(old,new), encoding="utf-8")
          PY
          grep -q 'distanceAtr in 0.04..1.10' ScalpSignalAndroid/app/src/main/java/com/scalpsignal/mobile/domain/SignalEngine.kt
          test -f ScalpSignalAndroid/settings.gradle.kts
          grep -q 'symbol == "SKYAIUSDT"' ScalpSignalAndroid/app/src/main/java/com/scalpsignal/mobile/domain/SignalEngine.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        shell: bash
        run: |
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          curl -fL --retry 3 -o /tmp/cmdtools.zip "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip"
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  /tmp/cmdtools.zip" | sha256sum -c -
          unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
          mv /tmp/cmdtools/cmdline-tools "$HOME/android-sdk/cmdline-tools/latest"
          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$HOME/android-sdk"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        shell: bash
        run: gradle --no-daemon -p ScalpSignalAndroid :app:assembleDebug

      - name: Validate APK
        shell: bash
        run: |
          APK="ScalpSignalAndroid/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p dist
          cp "$APK" dist/ScalpSignal-v0.2.apk
          unzip -tq dist/ScalpSignal-v0.2.apk
          sha256sum dist/ScalpSignal-v0.2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScalpSignal-v0.2-APK-Slim
          path: dist/ScalpSignal-v0.2.apk
          if-no-files-found: error
          retention-days: 7
