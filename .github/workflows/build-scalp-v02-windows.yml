name: Build Scalp Signal v0.2 APK Windows

on:
  push:
    branches:
      - build-scalp-signal-apk
    paths:
      - .github/workflows/build-scalp-v02-windows.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore v0.2 source
        shell: powershell
        run: |
          $parts = 0..4 | ForEach-Object { Get-Content ".ci/scalp-v02.part$_" -Raw }
          $b64 = $parts -join ""
          $zip = Join-Path $env:RUNNER_TEMP "scalp-v02.zip"
          [IO.File]::WriteAllBytes($zip, [Convert]::FromBase64String($b64))
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "3b654cc6918fe1ccff2dece2502db5d97bf9dc7583f38673cefab400efe0cc8c") { throw "Source SHA mismatch: $hash" }
          Expand-Archive -Path $zip -DestinationPath $env:GITHUB_WORKSPACE -Force
          if (-not (Test-Path "ScalpSignalAndroid/settings.gradle.kts")) { throw "Project restore failed" }
          if (-not (Select-String -Path "ScalpSignalAndroid/app/src/main/java/com/scalpsignal/mobile/domain/SignalEngine.kt" -SimpleMatch 'symbol == "SKYAIUSDT"')) { throw "SKY exclusion missing" }

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK 36
        shell: powershell
        run: |
          $sdk = (Get-Command sdkmanager.bat -ErrorAction SilentlyContinue).Source
          if (-not $sdk -and $env:ANDROID_HOME) {
            $sdk = Get-ChildItem -Path (Join-Path $env:ANDROID_HOME "cmdline-tools") -Filter "sdkmanager.bat" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $sdk) { throw "sdkmanager.bat not found" }
          & $sdk "platforms;android-36" "build-tools;36.0.0"
          if ($LASTEXITCODE -ne 0) { throw "sdkmanager failed" }

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        shell: powershell
        run: |
          gradle.bat --no-daemon -p ScalpSignalAndroid :app:assembleDebug
          if ($LASTEXITCODE -ne 0) { throw "Gradle build failed" }

      - name: Validate APK
        shell: powershell
        run: |
          $apk = "ScalpSignalAndroid/app/build/outputs/apk/debug/app-debug.apk"
          if (-not (Test-Path $apk)) { throw "APK missing" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $apk "dist/ScalpSignal-v0.2.apk"
          Get-FileHash "dist/ScalpSignal-v0.2.apk" -Algorithm SHA256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScalpSignal-v0.2-APK-Windows
          path: dist/ScalpSignal-v0.2.apk
          if-no-files-found: error
          retention-days: 7
