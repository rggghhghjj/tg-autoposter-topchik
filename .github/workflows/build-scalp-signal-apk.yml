name: Build Scalp Signal APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  issues:
    types: [opened]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4
        with:
          ref: build-scalp-signal-apk

      - name: Rebuild project archive
        shell: bash
        run: |
          cat scalp-signal-packed/chunk_*.txt | base64 --decode > ScalpSignalAndroid_v0.1.zip
          unzip -q ScalpSignalAndroid_v0.1.zip
          test -f ScalpSignalAndroid/settings.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        working-directory: ScalpSignalAndroid
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          ls -lh ScalpSignalAndroid/app/build/outputs/apk/debug/app-debug.apk
          sha256sum ScalpSignalAndroid/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScalpSignal-Android-v0.1
          path: ScalpSignalAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
