        run: |
          printf '%s' "$PROJECT_B64" | tr -d '\n ' | base64 --decode > /tmp/scalp-project.zip
          unzip -q /tmp/scalp-project.zip -d "$GITHUB_WORKSPACE"
          test -f ScalpSignalAndroid/settings.gradle.kts
          grep -q 'symbol != "SKYAIUSDT"' ScalpSignalAndroid/app/src/main/java/com/scalpsignal/mobile/data/BinanceApi.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle --no-daemon -p ScalpSignalAndroid :app:assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp ScalpSignalAndroid/app/build/outputs/apk/debug/app-debug.apk dist/ScalpSignal-v0.1.apk
          sha256sum dist/ScalpSignal-v0.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScalpSignal-v0.1-APK
          path: dist/ScalpSignal-v0.1.apk
          if-no-files-found: error
          retention-days: 7
